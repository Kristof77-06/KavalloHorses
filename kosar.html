<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kosár</title>

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <!-- Font Awesome ikonok -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <!-- Egyéni stíluslapok -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mobilmenu.css" />
    <link rel="stylesheet" href="kosar.css" />

    <!-- NINCS dinamikus padding-top a body-n -->
    <style>
      /* Biztosítsuk, hogy ne legyen felesleges felső sáv */
      html, body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <!-- Navigációs sáv (nem fix, így nincs szükség body padding-top-ra) -->
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark w-100">
      <div class="container-fluid">
        <!-- Gépi keresőmező -->
        <form class="d-none d-sm-flex me-auto" role="search" onsubmit="event.preventDefault(); keresesInditasa();">
          <input type="text" id="keresoMezo" class="form-control me-2" placeholder="Keresés..." />
          <button type="submit" class="btn btn-outline-light">Keresés</button>
        </form>

        <!-- Mobilos kereső gomb -->
        <div class="d-sm-none d-flex justify-content-start px-3">
          <button class="btn btn-outline-light" onclick="toggleKeresosav()" aria-label="Mobil kereső">
            <i class="fa fa-search"></i>
          </button>
        </div>

        <!-- Mobilos kereső sáv -->
        <div id="mobilKeresosav" class="d-sm-none px-3" style="display: none;">
          <input type="text" id="mobilKeresoMezo" class="form-control my-2" placeholder="Írd be, amit keresel..." />
          <button class="btn btn-primary mb-3" onclick="keresesInditasa()">Keresés indítása</button>
        </div>

        <!-- Menü gomb -->
        <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar" aria-controls="mynavbar" aria-expanded="false" aria-label="Menü">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menü elemek -->
        <div class="collapse navbar-collapse" id="mynavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="Kezdolap.html">Kezdőlap</a></li>
            <li class="nav-item"><a class="nav-link" href="rolunk.html">Rólunk</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html">Termékeink</a></li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center" href="kosar.html">
                <i class="fa fa-shopping-cart me-1"></i>
                <span class="d-none d-md-inline">Kosár</span>
                <span id="kosarDb">(0)</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Kosár tartalom -->
    <main class="row">
      <div class="container mt-5 cart-container">
        <h1 class="text-center">🛒 Kosarad</h1>

        <div class="d-flex justify-content-end mb-3">
          <button id="clear-cart" class="btn btn-outline-danger" title="Kosár ürítése">
            <i class="fa fa-trash"></i>
          </button>
        </div>

        <div id="cart-items"></div>

        <div class="total mt-3" id="cart-total">Összesen: 0 Ft</div>

        <div class="d-flex justify-content-end mt-3">
          <button id="checkout" class="btn btn-primary">Megrendelés elküldése</button>
        </div>
      </div>
    </main>

    <!-- Lábléc kívül a main-től -->
    <footer class="site-footer text-center py-4" style="background-color: #ffffff;">
      <div class="container">
        <p class="mb-1">© 2025 Webshop - Minden jog fenntartva</p>
        <p class="mb-1">Kézzel készült termékek, szeretettel</p>
      </div>
    </footer>

    <!-- Kosár működés -->
    <script src="kosar.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </body>
</html>
